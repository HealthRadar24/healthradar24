name: Fork Invariants

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'
      - name: Check HealthRadar24 operational boundaries
        run: node scripts/check-fork-invariants.mjs
      - name: Validate HealthRadar24 readiness policy
        run: npm run fork:readiness:config
