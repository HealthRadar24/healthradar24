name: Fork Invariants

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'
      - name: Check HealthRadar24 operational boundaries
        run: node scripts/check-fork-invariants.mjs
      - name: Validate HealthRadar24 readiness policy
        run: npm run fork:readiness:config
      - name: Validate HealthRadar24 Railway profile
        run: npm run fork:railway:config
      - name: Validate HealthRadar24 healthcare source governance
        run: npm run health:governance
